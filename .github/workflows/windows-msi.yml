# Fork build: the Hungarian WordCraft as an unsigned Windows x64 MSI (+ portable zip), uploaded as
# the run's artifact "wordcraft-windows-x64-hu". Same packaging as release.yml's Windows job
# (packaging/windows/package.ps1), without signing secrets.
#
# The MSI keeps the official UpgradeCode, so installing it replaces an installed official
# WordCraft of the same or an older version (and a later official installer replaces it).
name: Windows MSI (magyar)

on:
  push:
    branches: [claude/zen-babbage-f40y72]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-msi-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  WORDCRAFT_BUILD_SHA: ${{ github.sha }}

jobs:
  msi:
    name: Windows x64 MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The fonts the official releases embed (storytold/craft-fonts docs/integration.md).
      - name: Check out craft-fonts
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-windows-msi-x64
      - name: Resolve version
        shell: bash
        run: |
          . packaging/env.sh
          {
            echo "WORDCRAFT_VERSION=$VERSION-hu"
            echo "WORDCRAFT_BUILD_DATE=$(date -u +%Y-%m-%d)"
          } >>"$GITHUB_ENV"
      - name: Install WiX
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build and package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-windows-x64-hu
          path: dist/release/*
          if-no-files-found: error
